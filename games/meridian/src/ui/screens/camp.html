<section class="screen camp" data-screen="camp" aria-labelledby="camp-title">
  <h1 id="camp-title" data-role="title">Camp</h1>
  <p class="lead purse" data-role="purse" aria-live="polite"></p>
  <div class="tabs" role="tablist" aria-label="Camp">
    <button role="tab" data-tab="buy" autofocus>Buy</button>
    <button role="tab" data-tab="craft">Craft</button>
    <button role="tab" data-tab="upgrade">Upgrade</button>
  </div>
  <p class="camp-note" data-role="note" aria-live="polite"></p>
  <nav class="menu-list camp-list" role="tabpanel" aria-label="Camp items" data-role="list"></nav>
  <div class="actions">
    <button class="primary" data-action="leave">Leave camp</button>
  </div>
</section>
