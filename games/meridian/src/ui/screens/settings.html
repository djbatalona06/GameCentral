<section class="screen settings" data-screen="settings" aria-labelledby="set-title">
  <h1 id="set-title">Settings</h1>
  <div class="tabs" role="tablist" aria-label="Settings categories">
    <button role="tab" data-tab="a11y" autofocus>Accessibility</button>
    <button role="tab" data-tab="gameplay">Gameplay</button>
    <button role="tab" data-tab="controls">Controls</button>
    <button role="tab" data-tab="audio">Audio</button>
    <button role="tab" data-tab="video">Video</button>
  </div>
  <div class="settings-panel" role="tabpanel" data-role="panel"></div>
  <div class="actions">
    <button data-action="reset">Reset to defaults</button>
    <button class="primary" data-action="back">Done</button>
  </div>
</section>
