<section class="screen pause" data-screen="pause" aria-labelledby="pause-title">
  <h1 id="pause-title">Paused</h1>
  <p class="objective-recap" data-role="objective"></p>
  <nav class="menu-list" aria-label="Pause menu">
    <button class="primary" data-action="resume">Resume</button>
    <button data-action="skip-puzzle" hidden>Skip this puzzle</button>
    <button data-action="journal">Journal</button>
    <button data-action="settings">Settings</button>
    <button data-action="restart">Restart from checkpoint</button>
    <button data-action="quit">Save and quit to menu</button>
  </nav>
  <p class="status" data-role="pause-stats"></p>
</section>
