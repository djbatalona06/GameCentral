<section class="screen slots" data-screen="slots" aria-labelledby="slots-title">
  <h1 id="slots-title">Choose a save slot</h1>
  <ul class="slot-list" data-role="slot-list"></ul>
  <div class="actions">
    <button data-action="import">Import save file</button>
    <button data-action="back">Back</button>
  </div>
  <input type="file" accept="application/json" data-role="import-file" hidden>
</section>
