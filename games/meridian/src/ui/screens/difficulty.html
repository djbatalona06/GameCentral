<section class="screen difficulty" data-screen="difficulty" aria-labelledby="diff-title">
  <h1 id="diff-title">Choose a difficulty</h1>
  <p class="lead">You can change this at any time, and fine-tune individual sliders in Settings.</p>
  <div class="card-grid">
    <button data-difficulty="0"><strong>Story</strong><small>Enemies are slow to notice you and rarely hit. For enjoying the adventure.</small></button>
    <button data-difficulty="1"><strong>Explorer</strong><small>A gentle challenge. Recommended for most players on touch screens.</small></button>
    <button data-difficulty="2"><strong>Hunter</strong><small>Smarter, deadlier enemies. Cover matters.</small></button>
    <button data-difficulty="3"><strong>Legend</strong><small>Punishing. Every mistake counts.</small></button>
  </div>
  <div class="actions">
    <button data-action="back">Back</button>
  </div>
</section>
