<div class="hud" data-role="hud">
  <div class="vignette" data-role="vignette"></div>
  <div class="scope" data-role="scope"></div>
  <div class="letterbox top" data-role="lb-top"></div>
  <div class="letterbox bottom" data-role="lb-bottom"></div>
  <div class="objective" data-role="objective" aria-live="polite"></div>
  <div class="checkpoint" data-role="checkpoint" aria-live="polite"></div>
  <div class="reticle" data-role="reticle">
    <span class="r-dot"></span>
    <span class="r-arm r-up"></span>
    <span class="r-arm r-down"></span>
    <span class="r-arm r-left"></span>
    <span class="r-arm r-right"></span>
    <span class="r-hit" data-role="hitmarker"></span>
  </div>
  <div class="threats" data-role="threats"></div>
  <div class="damage" data-role="damage"></div>
  <div class="sounds" data-role="sounds"></div>
  <div class="ammo" data-role="ammo">
    <span class="weapon-name" data-role="weapon-name"></span>
    <span class="mag" data-role="mag"></span>
    <span class="reserve" data-role="reserve"></span>
    <span class="throwables" data-role="throwables"></span>
  </div>
  <div class="balance" data-role="balance"><span data-role="balance-needle"></span></div>
  <div class="prompt" data-role="prompt"></div>
  <div class="tutorial" data-role="tutorial" aria-live="polite"></div>
  <div class="toasts" data-role="toasts" aria-live="polite"></div>
  <div class="hint" data-role="hint"></div>
  <div class="subtitles" data-role="subtitles" aria-live="polite"></div>
  <button class="skip-cutscene" data-role="skip" aria-label="Skip cutscene">Skip</button>
  <div class="fps" data-role="fps"></div>
</div>
