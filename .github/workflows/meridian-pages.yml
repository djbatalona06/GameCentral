# Publishes Meridian as a free website on GitHub Pages:
#   https://djbatalona06.github.io/GameCentral/
# iPhone players open that link in Safari and choose "Add to Home Screen" to install it.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Meridian website

on:
  push:
    branches: [main]
    paths: ["games/meridian/**", ".github/workflows/meridian-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: games/meridian
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/meridian/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: games/meridian/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
